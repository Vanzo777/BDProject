version: '3.2'

services:
  minio:
    image: minio/minio
    container_name: minio-server
    env_file: ./minio.env-sample
    volumes:
      - ./minio-data:/data
    ports:
      - "9001:9001"
      - "9000:9000"
    command: minio server /data --console-address ":9001"
    networks:
      - big_data_net

networks:
  big_data_net:
    external: true
