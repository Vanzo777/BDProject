# Semantic Layer для SQL AI Agent
# Этот файл описывает структуру данных для LLM

# Общая информация о базе данных
database:
  name: "Mock Analytics Database"
  description: "Аналитические витрины для демонстрации AI-агента"
  dialect: "postgresql"

# Описание таблиц
tables:
  sales_summary:
    description: "Агрегированные продажи по дням. Содержит ежедневную статистику продаж за последние 90+ дней."
    business_context: "Используется для анализа динамики продаж, выявления трендов и расчёта ключевых метрик выручки."
    columns:
      sale_date:
        type: "date"
        description: "Дата продажи"
        nullable: false
        primary_key: true
      total_amount:
        type: "decimal(12,2)"
        description: "Общая сумма продаж за день в рублях"
        nullable: false
        business_meaning: "Дневная выручка"
      order_count:
        type: "integer"
        description: "Количество заказов за день"
        nullable: false
        business_meaning: "Число транзакций"
      avg_order_value:
        type: "decimal(10,2)"
        description: "Средний чек за день (total_amount / order_count)"
        nullable: false
        business_meaning: "Средняя стоимость одного заказа"
    data_range:
      from: "90 дней назад"
      to: "вчера"
      row_count: "~90-120 записей"
    
  customer_stats:
    description: "Статистика по клиентам. Агрегированная информация о покупательской активности каждого клиента."
    business_context: "Используется для сегментации клиентов, анализа LTV и выявления VIP-клиентов."
    columns:
      customer_id:
        type: "integer"
        description: "Уникальный ID клиента"
        nullable: false
        primary_key: true
      customer_name:
        type: "varchar(100)"
        description: "Имя клиента"
        nullable: false
      email:
        type: "varchar(100)"
        description: "Email клиента"
        nullable: true
      total_orders:
        type: "integer"
        description: "Общее количество заказов клиента за всё время"
        nullable: false
      lifetime_value:
        type: "decimal(12,2)"
        description: "Общая сумма покупок клиента за всё время (LTV)"
        nullable: false
        business_meaning: "Ценность клиента"
      first_order_date:
        type: "date"
        description: "Дата первого заказа клиента"
        nullable: false
      last_order_date:
        type: "date"
        description: "Дата последнего заказа клиента"
        nullable: false
      avg_order_value:
        type: "decimal(10,2)"
        description: "Средний чек клиента (lifetime_value / total_orders)"
        nullable: false
      customer_segment:
        type: "varchar(20)"
        description: "Сегмент клиента"
        nullable: false
        possible_values: ["VIP", "Regular", "New"]
        business_meaning: "VIP - высокая ценность, Regular - обычные клиенты, New - новые клиенты"
    data_range:
      row_count: "~50 клиентов"
    
  product_performance:
    description: "Производительность товаров. Статистика продаж и остатков по каждому товару."
    business_context: "Используется для анализа популярности товаров, управления остатками и оптимизации ассортимента."
    columns:
      product_id:
        type: "integer"
        description: "Уникальный ID товара"
        nullable: false
        primary_key: true
      product_name:
        type: "varchar(200)"
        description: "Название товара"
        nullable: false
      category:
        type: "varchar(50)"
        description: "Категория товара"
        nullable: false
        possible_values: ["Электроника", "Одежда", "Продукты питания"]
      total_quantity_sold:
        type: "integer"
        description: "Общее количество проданных единиц товара"
        nullable: false
      total_revenue:
        type: "decimal(12,2)"
        description: "Общая выручка от продажи товара"
        nullable: false
      avg_price:
        type: "decimal(10,2)"
        description: "Средняя цена продажи товара"
        nullable: false
      units_in_stock:
        type: "integer"
        description: "Текущий остаток товара на складе"
        nullable: false
      last_sale_date:
        type: "date"
        description: "Дата последней продажи товара"
        nullable: true
        business_meaning: "NULL означает, что товар ещё не продавался"
    data_range:
      row_count: "~30 товаров"

# Связи между таблицами (для JOIN-запросов)
relationships:
  # В текущих витринах нет прямых FK, но можно описать логические связи
  - description: "Нет прямых связей между витринами, это независимые агрегаты"

# Бизнес-правила и особенности данных
business_rules:
  - rule: "Все суммы указаны в рублях"
  - rule: "Данные в sales_summary обновляются ежедневно"
  - rule: "customer_segment 'VIP' присваивается клиентам с lifetime_value > 100000"
  - rule: "NULL в last_sale_date означает, что товар на складе, но ещё не продавался"
  - rule: "avg_order_value рассчитывается как total_amount / order_count"

# Примеры запросов для few-shot learning
examples:
  - question: "Какая была выручка за декабрь 2024?"
    sql: "SELECT SUM(total_amount) AS total_revenue FROM sales_summary WHERE sale_date >= '2024-12-01' AND sale_date <= '2024-12-31'"
    explanation: "Суммируем все продажи за указанный период"
    
  - question: "Топ 5 клиентов по сумме покупок"
    sql: "SELECT customer_name, lifetime_value FROM customer_stats ORDER BY lifetime_value DESC LIMIT 5"
    explanation: "Сортируем клиентов по LTV в убывающем порядке и берём первые 5"
    
  - question: "Средний чек за последние 7 дней"
    sql: "SELECT AVG(avg_order_value) AS avg_check FROM sales_summary WHERE sale_date >= CURRENT_DATE - INTERVAL '7 days'"
    explanation: "Усредняем средний чек за последнюю неделю"
    
  - question: "Сколько VIP клиентов?"
    sql: "SELECT COUNT(*) AS vip_count FROM customer_stats WHERE customer_segment = 'VIP'"
    explanation: "Считаем клиентов в сегменте VIP"
    
  - question: "Какие товары из категории Электроника принесли больше всего выручки?"
    sql: "SELECT product_name, total_revenue FROM product_performance WHERE category = 'Электроника' ORDER BY total_revenue DESC LIMIT 10"
    explanation: "Фильтруем по категории и сортируем по выручке"
    
  - question: "Динамика продаж за последний месяц по дням"
    sql: "SELECT sale_date, total_amount, order_count FROM sales_summary WHERE sale_date >= CURRENT_DATE - INTERVAL '30 days' ORDER BY sale_date"
    explanation: "Выбираем продажи за месяц с сортировкой по дате"
    
  - question: "Какие товары заканчиваются на складе?"
    sql: "SELECT product_name, category, units_in_stock FROM product_performance WHERE units_in_stock < 20 ORDER BY units_in_stock"
    explanation: "Фильтруем товары с малым остатком (менее 20 единиц)"
    
  - question: "Средний LTV клиентов по сегментам"
    sql: "SELECT customer_segment, AVG(lifetime_value) AS avg_ltv, COUNT(*) AS customer_count FROM customer_stats GROUP BY customer_segment ORDER BY avg_ltv DESC"
    explanation: "Группируем клиентов по сегментам и считаем средний LTV"
    
  - question: "Самый прибыльный день в декабре"
    sql: "SELECT sale_date, total_amount FROM sales_summary WHERE sale_date >= '2024-12-01' AND sale_date <= '2024-12-31' ORDER BY total_amount DESC LIMIT 1"
    explanation: "Находим день с максимальной выручкой в декабре"
    
  - question: "Клиенты, которые не делали заказов больше месяца"
    sql: "SELECT customer_name, last_order_date, total_orders FROM customer_stats WHERE last_order_date < CURRENT_DATE - INTERVAL '30 days' ORDER BY last_order_date"
    explanation: "Фильтруем клиентов с давней последней покупкой"

# Синонимы и алиасы для естественного языка
synonyms:
  revenue: ["выручка", "доход", "продажи", "оборот"]
  customer: ["клиент", "покупатель", "заказчик"]
  product: ["товар", "продукт"]
  order: ["заказ", "покупка", "транзакция"]
  average: ["средний", "среднее", "в среднем"]
  total: ["общий", "всего", "суммарный"]
  count: ["количество", "число", "сколько"]
  
# Метаданные для команды
metadata:
  version: "1.0"
  last_updated: "2024-12-20"
  owner: "AI Agent Team"
  notes: "Mock данные для разработки. После получения реальных витрин обновить описания и примеры."