    en: ["order", "request"]
  
  volume:
    ru: ["объём", "объем", "оборот"]
    en: ["volume", "turnover"]
  
  product:
    ru: ["продукт", "инструмент", "актив", "тикер"]
    en: ["product", "instrument", "asset", "ticker", "symbol"]
  
  rate:
    ru: ["доля", "процент", "коэффициент", "рейт"]
    en: ["rate", "ratio", "percentage"]
  
  maker:
    ru: ["мейкер", "пассивный ордер", "лимитный"]
    en: ["maker", "passive", "limit order"]
  
  taker:
    ru: ["тейкер", "агрессивный ордер", "рыночный"]
    en: ["taker", "aggressive", "market order"]
  
  strike:
    ru: ["страйк", "цена исполнения"]
    en: ["strike", "strike price", "exercise price"]
  
  expiration:
    ru: ["экспирация", "истечение", "дата истечения"]
    en: ["expiration", "expiry", "maturity"]

# Метаданные
metadata:
  version: "1.0.0"
  last_updated: "2025-12-27"
  owner: "Trading Analytics Team"
  domain: "Financial Markets Trading"
  notes: |
    Аналитические витрины для мониторинга торговой активности.
    Данные обновляются периодически по расписанию.
    Все метрики рассчитываются на основе исторических данных о торговле.